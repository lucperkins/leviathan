[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Keep the site out of search engines and well-behaved crawlers (robots.txt
# in public/ does the same for bots that read it). These are requests, not
# enforcement; only authentication can actually block a scraper.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, noimageindex"
