<svg viewBox="0 0 1020 696" role="img" aria-label="The definitions of Part III: religion, the word of God, prophet, miracle and the holy feed into the definition of a church, which is built from person and soveraign, and which divides ecclesiasticall power into teaching and jurisdiction." class="fig" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
