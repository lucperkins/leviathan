<svg viewBox="0 0 1020 1272" role="img" aria-label="Twenty-two of Hobbes&#x27;s definitions, from motion in the Introduction down to crime and punishment in Chapter XXVIII, each drawn from terms defined above it." class="fig" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
