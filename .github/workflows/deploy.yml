name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run check:links
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bunx netlify-cli deploy --prod --dir dist --message "${{ github.sha }}"
          else
            bunx netlify-cli deploy --dir dist --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}"
          fi
