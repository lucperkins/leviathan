name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # FlakeHub Cache authenticates with the job's OIDC token.
  id-token: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo; don't leave the token in .git/config.
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - uses: DeterminateSystems/flakehub-cache-action@83293488abfd33fbfb2ab084097467491c029962 # v3.22.2
      # Bun's global download cache, so a lockfile hit skips refetching
      # every package. The frozen install below still verifies against the
      # lockfile; this only saves the network.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # Everything runs inside the flake's dev shell, so CI uses the same
      # bun and netlify-cli that `nix develop` provides locally.
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bun run check
      - run: nix develop --command bun run build
      - run: nix develop --command bun run check:links
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            nix develop --command netlify deploy --prod --dir dist --message "${{ github.sha }}"
          else
            nix develop --command netlify deploy --dir dist --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}"
          fi
